<style>
:root{--navy:#14305e;--navy2:#0b1b3a;--gold:#b8892d;--paper:#f7f9fd;--head:#dfe7f3}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:"Segoe UI",Roboto,Arial,sans-serif;background:#e6eaf1;color:var(--navy2)}
.toolbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #cfd6e4;padding:10px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.toolbar h1{font-size:16px;margin:0;color:var(--navy)}.toolbar label{font-size:12px;font-weight:600;color:#475569;display:flex;flex-direction:column;gap:3px}
.toolbar input,.toolbar button{font:inherit;font-size:13px;padding:6px 9px;border:1px solid #b9c3d6;border-radius:6px}
.toolbar button{font-weight:700;background:var(--navy);color:#fff;border:0;padding:8px 15px;cursor:pointer}
.cyc{font-size:13px;font-weight:600;color:var(--navy);background:#eef3fb;border:1px solid #cfd9ec;padding:6px 10px;border-radius:6px}
.jump{display:flex;gap:6px;flex-wrap:wrap}.jump a{font-size:11.5px;text-decoration:none;color:var(--navy);background:#f1f4f9;border:1px solid #cfd6e4;padding:4px 9px;border-radius:999px}
#pages{padding:16px 0 30px;transform-origin:top center}
.sheet{position:relative;width:297mm;height:209.5mm;margin:0 auto 10mm;background:var(--paper);overflow:hidden;box-shadow:0 4px 18px rgba(20,48,94,.22);break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact;

.b1{position:absolute;inset:5mm;border:1.6mm solid var(--navy)}.b2{position:absolute;inset:7.9mm;border:.35mm solid var(--gold)}.b3{position:absolute;inset:9.1mm;border:.2mm solid var(--navy)}
.corner{position:absolute;width:11mm;height:11mm;background:var(--navy);z-index:2}.corner::after{content:"";position:absolute;left:50%;top:50%;width:4.2mm;height:4.2mm;background:var(--gold);transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 0 .5mm var(--navy),0 0 0 .8mm var(--gold)}
.c-tl{left:4.2mm;top:4.2mm}.c-tr{right:4.2mm;top:4.2mm}.c-bl{left:4.2mm;bottom:4.2mm}.c-br{right:4.2mm;bottom:4.2mm}

.addr{text-align:center;font-family:Georgia,serif;font-size:8.8pt;margin-top:1.6mm}.codes{text-align:center;font-size:8pt;color:var(--gold);font-weight:600;margin-top:.8mm;letter-spacing:.3px}
.rule{height:1.2mm;margin:2.2mm 10mm 0;border-top:.35mm solid var(--gold);border-bottom:.2mm solid var(--navy)}

.medium{justify-self:end;border:.35mm solid var(--gold);background:#fff8e6;color:var(--navy);font-weight:700;font-size:9.5pt;padding:1.5mm 5mm;border-radius:2.6mm;letter-spacing:.4px;white-space:nowrap}

.dayInput{width:100%;border:0;background:transparent;color:#000;text-align:center;font:inherit;font-weight:700;outline:none}.leaveInput{width:100%;border:0;background:transparent;color:#000;text-align:center;font:inherit;outline:none}.remarkInput{width:100%;border:0;background:transparent;color:#000;font:inherit;outline:none}
.foot{margin-top:auto;display:grid;grid-template-columns:1fr 36mm 1fr;align-items:end;column-gap:8mm;padding:0 4mm}.sig{display:flex;flex-direction:column}.sig .area{height:21mm;display:flex;align-items:flex-end;font-size:9pt;line-height:1.7}.sig .line{border-top:.35mm solid var(--navy)}.sig .lab{height:14mm;padding-top:1.2mm;font-size:8.6pt;font-weight:700;text-align:center;line-height:1.35}.sig .lab .nm{font-size:8.6pt;font-family:Georgia,serif;display:block;font-weight:600}.sig .lab i{font-weight:400;font-size:7.8pt;display:block}
.qrbox{display:flex;flex-direction:column;align-items:center}.qr{width:27mm;height:27mm;background:#fff;border:.4mm solid var(--gold);border-radius:1.6mm;padding:1.6mm;box-shadow:0 0 0 .6mm #fff;display:flex;align-items:center;justify-content:center}.qr img{width:100%;height:100%;object-fit:contain;display:block;image-rendering:auto}.qrcap{font-size:7pt;margin-top:1.2mm;text-align:center;color:#334155;height:14mm;line-height:1.3}

const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const pad=n=>String(n).padStart(2,'0'), dmy=d=>pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear(), inr=n=>Number(n).toLocaleString('en-IN');
function cycleFor(y,m){const start=new Date(y,m-1,11),end=new Date(y,m,10);let cy=end.getFullYear();if(end<new Date(cy,0,11))cy--;return {start,end,cumFrom:new Date(cy,0,11),monthLabel:MONTHS[m]+'-'+y,year:end.getFullYear()}}
function frame(inner,id,titleMedium){return `<section class="sheet" id="${id}"><div class="b1"></div><div class="b2"></div><div class="b3"></div><div class="corner c-tl"></div><div class="corner c-tr"></div><div class="corner c-bl"></div><div class="corner c-br"></div><div class="mid m-t"></div><div class="mid m-b"></div><div class="mid m-l"></div><div class="mid m-r"></div><div class="cornerInfo">${titleMedium} MEDIUM<br>${SCHOOL.place}, BANKURA</div><div class="content">${inner}</div></section>`}
function head(title,medium){return `<div class="school">${SCHOOL.name}</div><div class="addr">${SCHOOL.addr}</div><div class="codes">${SCHOOL.codes}</div><div class="rule"></div><div class="titlerow"><div></div><div class="pill">${title}</div><div class="medium">${medium} MEDIUM</div></div>`}
function footer(cy){return `<div class="foot"><div class="sig"><div class="area">Date : ____ / ____ / ${cy.year}<br>Place : ${SCHOOL.place}</div><div class="line"></div><div class="lab">Signature of Administrator / Secretary / President</div></div><div class="qrbox"><div class="qr"><img src="${QR}" alt="Exact QR Code"></div><div class="qrcap">Scan: Headmaster contact</div></div><div class="sig"><div class="area"></div><div class="line"></div><div class="lab">Signature of Headmaster<span class="nm">${SCHOOL.hm}</span><i>(with school seal)</i></div></div></div>`}
function monthlyReturn(medium,list,cy,id,dayId){const s=dmy(cy.start),e=dmy(cy.end),f=dmy(cy.cumFrom);const rows=list.map((t,i)=>`<tr><td class="c">${i+1}</td><td class="nm"><b>${t.name}</b><span>${t.dob}</span></td><td class="q"><b>${t.qual}</b>${t.doj.map(d=>`<span>${d}</span>`).join('')}</td><td class="c"><input class="dayInput" data-day="${dayId}" type="number" min="0" value="0"></td><td class="c"><input class="dayInput" data-day="${dayId}" type="number" min="0" value="0"></td><td class="c"><input class="leaveInput" type="number" min="0" value="0"></td><td class="c"><input class="leaveInput" type="number" min="0" value="0"></td><td class="c"><input class="leaveInput" type="number" min="0" value="0"></td><td class="c"><input class="leaveInput" type="number" min="0" value="0"></td><td><input class="remarkInput" type="text"></td><td></td></tr>`).join('');const widths=[9,38,34,16,16,16,16,25,25,20,29];return frame(`${head('MONTHLY RETURN',medium)}<div class="sub">Report of the Para Teacher for the Period From <b>${s}</b> To <b>${e}</b></div><table class="t mr"><colgroup>${widths.map(w=>`<col style="width:${w}mm">`).join('')}</colgroup><thead><tr><th>Sl.<br>No.</th><th>Name of the<br>Para Teacher<br>with Date of Birth</th><th>Qualification &amp;<br>Date of Joining</th><th>Working<br>Days<br>in this<br>Month</th><th>Closing<br>Days<br>in this<br>Month</th><th>C.L.<br>Enjoyed<br>in this<br>Month</th><th>Other<br>Leave<br>in this<br>Month</th><th>Total C.L.<br>Enjoyed from<br>${f}<br>to ${e}</th><th>Total Other<br>Leave Enjoyed<br>from ${f}<br>to ${e}</th><th>Remarks</th><th>Signature of<br>Para Teacher</th></tr></thead><tbody>${rows}</tbody></table>${footer(cy)}<div class="pageTag">PAGE ${id.replace('p','')} OF 4</div>`,id,medium)}
function salaryStatement(medium,list,cy,id){const n=list.length;const rows=list.map((t,i)=>`<tr><td class="c">${i+1}</td><td class="nm"><b>${t.name}</b></td><td class="c">${t.bank}</td><td class="c mono">${t.acc}</td><td class="c mono">${t.ifsc}</td><td class="c"><input class="dayInput" type="number" min="0" value="0"></td><td class="c">${inr(15523)}</td><td class="c">130</td><td class="c">1,800</td><td class="c net">13,593</td></tr>`).join('');const widths=[9,40,28,36,28,18,25,16,29,25];return frame(`${head('SALARY STATEMENT &nbsp;(FORMAT - CPF)',medium)}<div class="sub">Salary Statement of Para Teacher (Upper Primary) for the Month of <b>${cy.monthLabel}</b><span class="sep">◆</span>Name of Circle : <b>${SCHOOL.circle}</b></div><table class="t cpf"><colgroup>${widths.map(w=>`<col style="width:${w}mm">`).join('')}</colgroup><thead><tr><th>Sl.<br>No.</th><th>Name of<br>Employee</th><th>Bank &amp;<br>Branch Name</th><th>Account No</th><th>IFS Code</th><th>Nos of Days<br>Leave Without<br>Pay</th><th>Gross Consolidated<br>Salary for the Month<br>of ${cy.monthLabel}</th><th>P.TAX</th><th>EPF Deducted 12% of<br>Gross Salary but Not<br>More Than Rs.1800</th><th>Net Salary for the<br>Month of<br>${cy.monthLabel}</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td></td><td colspan="4" class="c">TOTAL</td><td></td><td class="c">${inr(15523*n)}</td><td class="c">${inr(130*n)}</td><td class="c">${inr(1800*n)}</td><td class="c">${inr(13593*n)}</td></tr></tfoot></table>${footer(cy)}<div class="pageTag">PAGE ${id.replace('p','')} OF 4</div>`,id,medium)}
function render(){const v=document.getElementById('endMonth').value;if(!v)return;const [y,m]=v.split('-').map(Number);const cy=cycleFor(y,m-1);document.getElementById('cycLabel').textContent='Period: '+dmy(cy.start)+' to '+dmy(cy.end)+' | Salary: '+cy.monthLabel;document.getElementById('pages').innerHTML=monthlyReturn('BENGALI',TEACHERS.BENGALI,cy,'p1','bDays')+monthlyReturn('SANTALI',TEACHERS.SANTALI,cy,'p2','sDays')+salaryStatement('BENGALI',TEACHERS.BENGALI,cy,'p3')+salaryStatement('SANTALI',TEACHERS.SANTALI,cy,'p4');syncDayInputs();fit()}
function syncDayInputs(){document.querySelectorAll('[data-day="bDays"]').forEach(x=>x.value=document.getElementById('bDays').value||0);document.querySelectorAll('[data-day="sDays"]').forEach(x=>x.value=document.getElementById('sDays').value||0);document.querySelectorAll('.dayInput[data-day]').forEach(x=>x.addEventListener('input',e=>{const id=e.target.dataset.day;document.getElementById(id).value=e.target.value;document.querySelectorAll('[data-day="'+id+'"]').forEach(y=>y.value=e.target.value)}))}
function fit(){const el=document.getElementById('pages');const need=297/25.4*96+32;el.style.zoom=Math.min(1,window.innerWidth/need)}
(function init(){const now=new Date();let y=now.getFullYear(),m=now.getMonth();if(now.getDate()>10){m++;if(m>11){m=0;y++}}document.getElementById('endMonth').value=y+'-'+pad(m+1);document.getElementById('endMonth').addEventListener('change',render);document.getElementById('bDays').addEventListener('input',render);document.getElementById('sDays').addEventListener('input',render);window.addEventListener('resize',fit);render()})();
</script>
