<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFHS Para Teacher Reports – Monthly Return &amp; Salary Statement (CPF)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --navy:#14305e; --navy2:#0b1b3a; --gold:#b8892d; --paper:#f7f9fd; --head:#dfe7f3;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",Roboto,Arial,Helvetica,sans-serif;background:#e6eaf1;color:var(--navy2)}

/* ---------- Screen toolbar ---------- */
.toolbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #cfd6e4;
  padding:10px 16px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.toolbar h1{font-size:16px;margin:0;color:var(--navy);font-weight:700}
.toolbar label{font-size:12px;font-weight:600;color:#475569;display:flex;flex-direction:column;gap:3px}
.toolbar input{font:inherit;font-size:13px;padding:5px 8px;border:1px solid #b9c3d6;border-radius:6px}
.toolbar button{font:inherit;font-size:13px;font-weight:600;padding:8px 16px;border:0;border-radius:6px;
  background:var(--navy);color:#fff;cursor:pointer}
.toolbar button:hover{background:#1d417f}
.cyc{font-size:13px;font-weight:600;color:var(--navy);background:#eef3fb;border:1px solid #cfd9ec;padding:6px 10px;border-radius:6px}
.jump{display:flex;gap:6px;flex-wrap:wrap}
.jump a{font-size:11.5px;text-decoration:none;color:var(--navy);background:#f1f4f9;border:1px solid #cfd6e4;padding:4px 9px;border-radius:999px}
.jump a:hover{background:#e3eaf7}
#pages{padding:16px 0 30px;transform-origin:top center}

/* ---------- A4 landscape sheet ---------- */
.sheet{position:relative;width:297mm;height:209.5mm;margin:0 auto 10mm;background:var(--paper);overflow:hidden;
  box-shadow:0 4px 18px rgba(20,48,94,.22);break-after:page;page-break-after:always;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
  background-image:
   url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='250' height='110'><text x='125' y='58' text-anchor='middle' font-family='Georgia,serif' font-size='10.5' letter-spacing='.6' fill='%2314305e' fill-opacity='0.075' transform='rotate(-24 125 55)'>TALDANGRA FULMATI HIGH SCHOOL (H.S.)</text></svg>"),
   linear-gradient(180deg,#fbfcff 0%,#f1f5fb 100%);
  background-size:250px 110px,100% 100%}
/* Official border */
.b1{position:absolute;inset:5mm;border:1.6mm solid var(--navy)}
.b2{position:absolute;inset:7.9mm;border:.35mm solid var(--gold)}
.b3{position:absolute;inset:9.1mm;border:.2mm solid var(--navy)}
.corner{position:absolute;width:11mm;height:11mm;background:var(--navy);z-index:2}
.corner::after{content:"";position:absolute;left:50%;top:50%;width:4.2mm;height:4.2mm;background:var(--gold);transform:translate(-50%,-50%) rotate(45deg);
  box-shadow:0 0 0 .5mm var(--navy),0 0 0 .8mm var(--gold)}
.c-tl{left:4.2mm;top:4.2mm}.c-tr{right:4.2mm;top:4.2mm}.c-bl{left:4.2mm;bottom:4.2mm}.c-br{right:4.2mm;bottom:4.2mm}
.mid{position:absolute;width:3.4mm;height:3.4mm;background:var(--gold);transform:rotate(45deg);z-index:2;box-shadow:0 0 0 .6mm var(--paper)}
.m-t{left:50%;top:3.3mm;margin-left:-1.7mm}.m-b{left:50%;bottom:3.3mm;margin-left:-1.7mm}
.m-l{top:50%;left:3.3mm;margin-top:-1.7mm}.m-r{top:50%;right:3.3mm;margin-top:-1.7mm}

.content{position:absolute;left:15mm;right:15mm;top:14mm;bottom:14mm;display:flex;flex-direction:column;z-index:1}

/* Header */
.school{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:23pt;letter-spacing:.5px;text-align:center;color:var(--navy);line-height:1.1}
.addr{text-align:center;font-family:Georgia,serif;font-size:8.8pt;margin-top:1.6mm}
.codes{text-align:center;font-size:8pt;color:var(--gold);font-weight:600;margin-top:.8mm;letter-spacing:.3px}
.rule{height:1.2mm;margin:2.2mm 10mm 0;border-top:.35mm solid var(--gold);border-bottom:.2mm solid var(--navy)}
.titlerow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:3.2mm}
.pill{background:var(--navy);color:#fff;font-family:Georgia,serif;font-weight:700;font-size:13pt;letter-spacing:.8px;
  padding:1.7mm 9mm;border-radius:3mm;text-align:center;white-space:nowrap}
.medium{justify-self:end;border:.35mm solid var(--gold);background:#fff8e6;color:var(--navy);font-weight:700;font-size:9.5pt;
  padding:1.5mm 5mm;border-radius:2.6mm;letter-spacing:.4px;white-space:nowrap}
.sub{text-align:center;font-family:Georgia,serif;font-size:9.6pt;margin:2.6mm 0 3mm}
.sub b{font-weight:700}
.sub .sep{margin:0 3mm;color:var(--gold)}

/* Tables */
table.t{width:100%;border-collapse:collapse;table-layout:fixed;border:.5mm solid var(--navy)}
.t th,.t td{border:.25mm solid var(--navy);padding:1.1mm 1.4mm;font-size:8pt;vertical-align:middle}
.t th{background:var(--head);color:var(--navy);font-weight:700;text-align:center;line-height:1.28;font-size:7.4pt;padding:1.8mm 1mm}
.t td{background:rgba(255,255,255,.74)}
.t td.c{text-align:center}.t td.r{text-align:right;padding-right:3mm}
.t td.nm b{display:block;font-size:8.6pt}
.t td.nm span,.t td.q span{display:block;font-size:8pt}
.t td.q b{font-size:8.6pt;display:block}
table.mr tbody tr{height:13.5mm}
table.cpf tbody tr{height:11mm}
table.cpf td.net{font-weight:700;font-size:9pt}
table.cpf td.mono{font-variant-numeric:tabular-nums;letter-spacing:.2px}
table.cpf tfoot td{background:var(--head);font-weight:700;font-size:9pt;height:9mm;border-top:.5mm solid var(--navy)}

/* Footer: Admin | QR | Headmaster */
.foot{margin-top:auto;display:grid;grid-template-columns:1fr 36mm 1fr;align-items:end;column-gap:8mm;padding:0 4mm}
.sig{display:flex;flex-direction:column}
.sig .area{height:21mm;display:flex;align-items:flex-end;font-size:9pt;line-height:1.7}
.sig .line{border-top:.35mm solid var(--navy)}
.sig .lab{height:14mm;padding-top:1.2mm;font-size:8.6pt;font-weight:700;text-align:center;line-height:1.35}
.sig .lab .nm{font-size:8.6pt;font-weight:600;font-family:Georgia,serif;font-weight:400;display:block;font-weight:600}
.sig .lab .hm{font-weight:700}
.sig .lab i{font-weight:400;font-size:7.8pt;display:block}
.qrbox{display:flex;flex-direction:column;align-items:center}
.qr{width:27mm;height:27mm;background:#fff;border:.4mm solid var(--gold);border-radius:1.6mm;padding:1.6mm;box-shadow:0 0 0 .6mm #fff}
.qr svg{width:100%;height:100%;display:block}
.qrcap{font-size:7pt;margin-top:1.2mm;text-align:center;color:#334155;height:14mm;line-height:1.3}

@page{size:A4 landscape;margin:0}
@media print{
  body{background:#fff}
  .toolbar{display:none!important}
  #pages{padding:0;zoom:1!important;transform:none!important}
  .sheet{margin:0;box-shadow:none}
  .sheet:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>

<div class="toolbar">
  <h1>TFHS Para Teacher Reports</h1>
  <label>Salary month (period ends on 10th)
    <input type="month" id="endMonth">
  </label>
  <label>Headmaster mobile (for QR)
    <input type="tel" id="hmMobile" placeholder="e.g. 9XXXXXXXXX" maxlength="15">
  </label>
  <div class="cyc" id="cycLabel"></div>
  <button onclick="window.print()">Print / Save PDF (4 pages)</button>
  <div class="jump">
    <a href="#p1">1 · Return – Bengali</a><a href="#p2">2 · Return – Santali</a>
    <a href="#p3">3 · CPF – Bengali</a><a href="#p4">4 · CPF – Santali</a>
  </div>
</div>

<div id="pages"></div>

<script>
/* ======================= DATA ======================= */
const SCHOOL = {
  name:"TALDANGRA FULMATI HIGH SCHOOL (H.S.)",
  addr:"P.O. &amp; Block - Taldangra, Sub-Division - Khatra, District - Bankura, West Bengal - 722152",
  codes:"HS Code 114071 &nbsp;|&nbsp; Index No. U1-083 &nbsp;|&nbsp; DISE 19132104401",
  circle:"TALDANGRA", place:"Taldangra",
  hm:"PRABIR KUMAR DANGAR"
};
const SAL = { gross:15523, ptax:130 };            // consolidated pay & P.Tax (same for all)
SAL.epf = Math.min(Math.round(SAL.gross*0.12),1800); // 12% of gross but not more than Rs.1800
SAL.net = SAL.gross - SAL.ptax - SAL.epf;

const TEACHERS = {
  BENGALI:[
    {name:"BHARATI DEY",  dob:"12.07.1973", qual:"B.A.(GEO)",       doj:["19.10.2004"], bank:"SBI<br>TALDANGRA", acc:"32171567657", ifsc:"SBIN0012397"},
    {name:"RINKU BHUIN",  dob:"01.03.1980", qual:"B.A.(Beng)",      doj:["19.10.2004"], bank:"SBI<br>TALDANGRA", acc:"32171603530", ifsc:"SBIN0012397"},
    {name:"BISWARUP DEY", dob:"12.04.1987", qual:"B.A.(Eng)",       doj:["17.12.2008"], bank:"SBI<br>TALDANGRA", acc:"32169323535", ifsc:"SBIN0012397"},
    {name:"DOLI MONDAL",  dob:"17.01.1975", qual:"B.Sc.(Pure Sc.)", doj:["1st:03.01.2007","2nd: 02.02.2010"], bank:"SBI<br>TALDANGRA", acc:"32171877251", ifsc:"SBIN0012397"}
  ],
  SANTALI:[
    {name:"GANESH MANDI",  dob:"04.01.1993", qual:"B.A.(Hons)", doj:["02.03.2015"], bank:"UBI<br>SIMLAPAL",  acc:"0448010233552", ifsc:"PUNB0044820"},
    {name:"BIKASH BASKEY", dob:"18.10.1980", qual:"B.A.(Pass)", doj:["01.03.2016"], bank:"SBI<br>TALDANGRA", acc:"35720612096",   ifsc:"SBIN0012397"},
    {name:"LAKSHMI SAREN", dob:"25.02.1989", qual:"B.A.(Pass)", doj:["01.03.2016"], bank:"SBI<br>TALDANGRA", acc:"35702689775",   ifsc:"SBIN0012397"}
  ]
};

/* ======================= HELPERS ======================= */
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const pad=n=>String(n).padStart(2,'0');
const dmy=d=>pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();   // dd.mm.yyyy
const inr=n=>Number(n).toLocaleString('en-IN');

/* Cycle: 11th of previous month -> 10th of selected month */
function cycleFor(y,m){                       // m = 0-11 (month in which period ends)
  const start=new Date(y,m-1,11), end=new Date(y,m,10);
  // cumulative leave counted from 11 January (calendar-year basis)
  let cy=end.getFullYear(); if(end < new Date(cy,0,11)) cy--;
  const cumFrom=new Date(cy,0,11);
  return {start,end,cumFrom,monthLabel:MONTHS[m]+'-'+y,year:end.getFullYear()};
}

function qrSvg(text){
  if(typeof qrcode==='undefined') return '<div style="font-size:7pt;text-align:center;padding-top:8mm">QR needs internet<br>once to load</div>';
  const q=qrcode(0,'M'); q.addData(text); q.make();
  const n=q.getModuleCount(); let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++) if(q.isDark(r,c)) d+=`M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><path d="${d}" fill="#0b1b3a"/></svg>`;
}
function vcard(){
  const tel=(document.getElementById('hmMobile').value||'').trim();
  return ['BEGIN:VCARD','VERSION:3.0','N:Dangar;Prabir Kumar;;;','FN:Prabir Kumar Dangar','TITLE:Headmaster',
    'ORG:Taldangra Fulmati High School (H.S.)','ADR:;;P.O. & Block Taldangra;Khatra;West Bengal;722152;India',
    tel?('TEL;TYPE=CELL:'+tel):'','END:VCARD'].filter(Boolean).join('\n');
}

/* ======================= PAGE BUILDERS ======================= */
function frame(inner,id){
  return `<section class="sheet" id="${id}">
    <div class="b1"></div><div class="b2"></div><div class="b3"></div>
    <div class="corner c-tl"></div><div class="corner c-tr"></div><div class="corner c-bl"></div><div class="corner c-br"></div>
    <div class="mid m-t"></div><div class="mid m-b"></div><div class="mid m-l"></div><div class="mid m-r"></div>
    <div class="content">${inner}</div></section>`;
}
function head(title,medium){
  return `<div class="school">${SCHOOL.name}</div>
    <div class="addr">${SCHOOL.addr}</div>
    <div class="codes">${SCHOOL.codes}</div>
    <div class="rule"></div>
    <div class="titlerow"><div></div><div class="pill">${title}</div><div class="medium">${medium} MEDIUM</div></div>`;
}
function footer(cy,qr){
  return `<div class="foot">
    <div class="sig">
      <div class="area">Date : ____ / ____ / ${cy.year}<br>Place : ${SCHOOL.place}</div>
      <div class="line"></div>
      <div class="lab">Signature of Administrator / Secretary / President</div>
    </div>
    <div class="qrbox"><div class="qr">${qr}</div><div class="qrcap">Scan: Headmaster contact</div></div>
    <div class="sig">
      <div class="area"></div>
      <div class="line"></div>
      <div class="lab">Signature of Headmaster<span class="nm">${SCHOOL.hm}</span><span class="hm">Headmaster</span><i>(with school seal)</i></div>
    </div>
  </div>`;
}

function monthlyReturn(medium,list,cy,qr,id){
  const s=dmy(cy.start), e=dmy(cy.end), f=dmy(cy.cumFrom);
  const rows=list.map((t,i)=>`<tr>
    <td class="c">${i+1}</td>
    <td class="nm"><b>${t.name}</b><span>${t.dob}</span></td>
    <td class="q"><b>${t.qual}</b>${t.doj.map(d=>`<span>${d}</span>`).join('')}</td>
    <td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`).join('');
  const widths=[9,38,34,16,16,16,16,25,25,20,29,23];
  return frame(`
    ${head('MONTHLY RETURN',medium)}
    <div class="sub">Report of the Para Teacher for the Period From <b>${s}</b> To <b>${e}</b></div>
    <table class="t mr">
      <colgroup>${widths.map(w=>`<col style="width:${w}mm">`).join('')}</colgroup>
      <thead><tr>
        <th>Sl.<br>No.</th><th>Name of the<br>Para Teacher<br>with Date of Birth</th><th>Qualification &amp;<br>Date of Joining</th>
        <th>Working<br>Days<br>in this<br>Month</th><th>Closing<br>Days<br>in this<br>Month</th>
        <th>C.L.<br>Enjoyed<br>in this<br>Month</th><th>Other<br>Leave<br>in this<br>Month</th>
        <th>Total C.L.<br>Enjoyed from<br>${f}<br>to ${e}</th><th>Total Other<br>Leave Enjoyed<br>from ${f}<br>to ${e}</th>
        <th>Remarks</th><th>Signature of<br>Para Teacher</th><th>AADHAAR</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${footer(cy,qr)}`,id);
}

function salaryStatement(medium,list,cy,qr,id){
  const n=list.length;
  const rows=list.map((t,i)=>`<tr>
    <td class="c">${i+1}</td><td class="nm"><b>${t.name}</b></td><td class="c">${t.bank}</td>
    <td class="c mono">${t.acc}</td><td class="c mono">${t.ifsc}</td><td class="c">0</td>
    <td class="c">${inr(SAL.gross)}</td><td class="c">${inr(SAL.ptax)}</td><td class="c">${inr(SAL.epf)}</td>
    <td class="c net">${inr(SAL.net)}</td><td></td></tr>`).join('');
  const widths=[9,40,28,36,28,18,25,16,29,25,13];
  return frame(`
    ${head('SALARY STATEMENT &nbsp;(FORMAT - CPF)',medium)}
    <div class="sub">Salary Statement of Para Teacher (Upper Primary) for the Month of <b>${cy.monthLabel}</b>
      <span class="sep">◆</span> Name of Circle : <b>${SCHOOL.circle}</b></div>
    <table class="t cpf">
      <colgroup>${widths.map(w=>`<col style="width:${w}mm">`).join('')}</colgroup>
      <thead><tr>
        <th>Sl.<br>No.</th><th>Name of<br>Employee</th><th>Bank &amp;<br>Branch Name</th><th>Account No</th><th>IFS Code</th>
        <th>Nos of Days<br>Leave Without<br>Pay</th><th>Gross Consolidated<br>Salary for the Month<br>of ${cy.monthLabel}</th>
        <th>P.TAX</th><th>EPF Deducted 12% of<br>Gross Salary but Not<br>More Than Rs.1800</th>
        <th>Net Salary for the<br>Month of<br>${cy.monthLabel}</th><th>Remarks</th>
      </tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td></td><td colspan="4" class="c">TOTAL</td><td></td>
        <td class="c">${inr(SAL.gross*n)}</td><td class="c">${inr(SAL.ptax*n)}</td><td class="c">${inr(SAL.epf*n)}</td>
        <td class="c">${inr(SAL.net*n)}</td><td></td></tr></tfoot>
    </table>
    ${footer(cy,qr)}`,id);
}

/* ======================= RENDER ======================= */
function render(){
  const v=document.getElementById('endMonth').value;
  if(!v) return;
  const [y,m]=v.split('-').map(Number);
  const cy=cycleFor(y,m-1);
  const qr=qrSvg(vcard());
  document.getElementById('cycLabel').textContent='Period: '+dmy(cy.start)+' to '+dmy(cy.end)+'  |  Salary: '+cy.monthLabel;
  document.getElementById('pages').innerHTML =
      monthlyReturn('BENGALI',TEACHERS.BENGALI,cy,qr,'p1')
    + monthlyReturn('SANTALI',TEACHERS.SANTALI,cy,qr,'p2')
    + salaryStatement('BENGALI',TEACHERS.BENGALI,cy,qr,'p3')
    + salaryStatement('SANTALI',TEACHERS.SANTALI,cy,qr,'p4');
  fit();
}
function fit(){                                   // scale preview to screen width (print unaffected)
  const el=document.getElementById('pages');
  const need=297/25.4*96+32;                      // sheet width in px + gutter
  el.style.zoom=Math.min(1,window.innerWidth/need);
}

(function init(){
  const now=new Date();
  let y=now.getFullYear(), m=now.getMonth();      // period ends on the next 10th
  if(now.getDate()>10){ m++; if(m>11){m=0;y++;} }
  document.getElementById('endMonth').value=y+'-'+pad(m+1);
  try{ document.getElementById('hmMobile').value=localStorage.getItem('tfhs_hm_mobile')||''; }catch(e){}
  document.getElementById('endMonth').addEventListener('change',render);
  document.getElementById('hmMobile').addEventListener('input',()=>{
    try{ localStorage.setItem('tfhs_hm_mobile',document.getElementById('hmMobile').value); }catch(e){}
    render();
  });
  window.addEventListener('resize',fit);
  window.addEventListener('load',render);
  render();
})();
</script>
</body>
</html>
